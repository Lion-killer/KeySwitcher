name: CI

# Збірка й тести на кожен push у main та на кожен pull request.
# windows-latest обовʼязковий: проєкти націлені на net10.0-windows і тягнуть WPF,
# тому на Linux-раннері нічого не збереться.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Збірка й тести
    runs-on: windows-latest
    steps:
      - name: Отримати код
        uses: actions/checkout@v5

      # .slnx і net10.0-windows вимагають саме SDK 10.
      - name: Встановити .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Відновити залежності
        run: dotnet restore KeySwitcher.slnx

      - name: Зібрати
        run: dotnet build KeySwitcher.slnx --configuration Release --no-restore

      - name: Тести
        run: dotnet test KeySwitcher.slnx --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Зберегти звіт про тести
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: '**/TestResults/tests.trx'
          if-no-files-found: ignore
